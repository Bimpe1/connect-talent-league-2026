<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Connect Talent League 2026</title>
    
    <!-- Mobile App & PWA Meta Tags for iOS & Android -->
    <meta name="theme-color" content="#0a2558" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Connect Talent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/connect-logo.png" />
    <link rel="apple-touch-icon" href="/connect-logo.png" />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              heading: ['Outfit', 'system-ui', 'sans-serif'],
            },
            colors: {
              ct: {
                navy: '#0a2558',
                'navy-dark': '#061739',
                'navy-light': '#163573',
                purple: '#6d28d9',
                'purple-dark': '#4c1d95',
                'purple-light': '#8b5cf6',
                violet: '#7c3aed',
                fuchsia: '#d926a9',
                bg: '#f8fafd'
              },
              brand: {
                50: '#f0f4fe',
                100: '#e0e9fd',
                200: '#c7d6fc',
                300: '#a3bdfa',
                400: '#759bf6',
                500: '#436cf0',
                600: '#2550e5',
                700: '#1d3ed1',
                800: '#163573',
                900: '#0a2558',
                950: '#051433',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Safe area padding for notch & home bar */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        -webkit-tap-highlight-color: transparent;
      }
      h1, h2, h3, h4, .font-heading {
        font-family: 'Outfit', system-ui, sans-serif;
      }
      /* Prevent iOS Safari auto-zoom on input focus by keeping font size at least 16px */
      @media screen and (max-width: 768px) {
        input, select, textarea {
          font-size: 16px !important;
        }
      }
      /* Custom smooth scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
